[project]
name = "hybro-mcp"
version = "0.1.0"
description = "Local Streamable HTTP tools for the Hybro Agent Network API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp>=2.2.0,<3",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
