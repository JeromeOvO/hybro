[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agents-backend"
version = "0.1.0"
description = "Multi-Agents Backend"
requires-python = ">=3.8"

[tool.setuptools]
packages = [
    "agents",
    "models",
    "common",
    "modules",
    "database",
    "services"
]