[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agents-backend"
version = "0.1.16"
description = "Multi-Agents Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette>=2.3.6",
    "starlette>=0.46.2",
    # A2A protocol
    "a2a-sdk>=0.3.25",
    # Database
    "motor>=3.7.1",
    "pymongo",
    "pinecone>=7.0.2",
    "redis>=5.2.0",
    # AI / LLM
    "google-genai>=1.20.0",
    "openai>=1.86.0",
    "tiktoken>=0.9.0",
    "mcp>=1.9.4",
    # AWS
    "aioboto3>=13.0.0",
    "botocore>=1.38.36",
    # HTTP clients
    "aiohttp>=3.12.13",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "requests>=2.32.4",
    # Auth
    "clerk-backend-api>=1.0.0",
    "jwcrypto>=1.5.6",
    "pyjwt>=2.8,<3",
    # Config / data validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    # Utilities
    "cachetools>=5.5.2",
    "loguru>=0.7.3",
    "python-dateutil>=2.9.0.post0",
    "gunicorn>=25.3.0",
]

[project.scripts]
multi-agents-backend = "main:main"
discover = "scripts.discovery_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--asyncio-mode=auto",
]
markers = [
    "asyncio: mark test as async",
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "slow: mark test as slow running",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = 'py312'
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
    ".pytest_cache"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C90"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.setuptools]
packages = [
    "models",
    "common",
    "modules",
    "database",
    "services",
    "config",
    "scripts",
    "infrastructure",
    "infrastructure.brokers",
]

[tool.uv]
preview = true
