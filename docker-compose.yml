version: '3.8'

services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  mongo-setup:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongo:27017 --eval '
      try {
        rs.status();
      } catch(e) {
        rs.initiate({ _id: "rs0", members: [ { _id: 0, host: "mongo:27017" } ] });
      }'


  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017/hybro
      - REDIS_URL=redis://redis:6379/0
      - API_PREFIX=/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

  # Optional local hub daemon for routing agent messages
  # hub:
  #   image: hybroai/hybro-hub:latest
  #   environment:
  #     - MONGO_URL=mongodb://mongo:27017/hybro
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     - mongo
  #     - redis

volumes:
  mongo_data:
  redis_data:
