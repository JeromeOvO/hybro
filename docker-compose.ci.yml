# Docker Compose overlay for CI and automated regression testing.
# Adds an OpenAI-compatible mock LLM service and makes the backend wait for it.
#
# The stack is started through the CLI so backend, frontend and Agents keep
# receiving only validated JSON-derived projections:
#   ./scripts/hybro start --build --compose-file docker-compose.ci.yml
# with HYBRO_HOME pointing at the CI runtime directory whose config.json selects
# `backend.openai_base_url=http://mock-llm:8080/v1`.

services:
  mock-llm:
    image: python:3.12-slim
    command: python -u /scripts/mock_llm_server.py 8080
    volumes:
      - ./scripts/mock_llm_server.py:/scripts/mock_llm_server.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: always

  backend:
    depends_on:
      mock-llm:
        condition: service_healthy
