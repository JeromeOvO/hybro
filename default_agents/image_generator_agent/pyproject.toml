[project]
name = "image-generator-agent"
version = "1.0.0"
description = "Generate or edit images using A2A and the OpenAI Images API"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
